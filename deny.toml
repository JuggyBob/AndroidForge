[advisories]
version = 2
yanked = "deny"
# These are unmaintained advisories, not known vulnerabilities. chrono is used
# directly; zbus_names/zvariant/zvariant_derive are transitive through
# accesskit/atspi on Linux. Migrations are tracked as post-0.9.4 work.
ignore = [
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies are intentionally unversioned and pinned by the
# same Cargo.lock; report them rather than treating them as registry wildcards.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
