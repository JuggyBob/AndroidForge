name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and verify
        shell: pwsh
        run: |
          cargo build --workspace --release
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }

          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith("v")) {
            throw "Release workflow must run from a v* tag, got '$tag'"
          }
          $expected = $tag.Substring(1)
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne $expected) {
            throw "Tag $tag does not match workspace version $version"
          }
          $cliVersion = (.\target\release\androidforge.exe --version).Trim()
          if ($cliVersion -ne "androidforge $version") {
            throw "CLI reported '$cliVersion', expected 'androidforge $version'"
          }

      - name: Package portable ZIP, installer and checksums
        shell: pwsh
        run: |
          ./packaging/package.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          if (-not (Test-Path "dist/androidforge-windows-x86_64-setup.exe")) {
            throw "installer was not produced; iscc.exe was not found"
          }
          if (-not (Test-Path "dist/androidforge-desktop-windows-x86_64.zip")) {
            throw "portable ZIP was not produced"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: androidforge-windows-x86_64-release
          path: |
            dist/androidforge-cli-windows-x86_64.zip
            dist/androidforge-desktop-windows-x86_64.zip
            dist/androidforge-windows-x86_64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/release-notes/$tag.md"
          $notesArg = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          gh release create $tag `
            dist/androidforge-cli-windows-x86_64.zip `
            dist/androidforge-desktop-windows-x86_64.zip `
            dist/androidforge-windows-x86_64-setup.exe `
            dist/SHA256SUMS.txt `
            --title "AndroidForge $tag" `
            --prerelease `
            @notesArg
