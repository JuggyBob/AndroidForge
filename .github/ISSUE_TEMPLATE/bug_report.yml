name: Bug report
description: Report a reproducible AndroidForge defect
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include signing secrets, keystores, personal device data or
        production credentials. For security issues, use the private reporting path in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A clear, short description.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AndroidForge version and binary hash
      description: Output of `androidforge --version`, plus SHA-256 if self-built.
      placeholder: "0.1.0 / 9832c11b..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Rust version, Android SDK/build-tools, device or emulator image.
      placeholder: "Windows 11, Rust 1.100, SDK 36.0.0, Android 16 API 36 x86_64"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and structured error
      description: Exact command, exit code, and the JSON error. Include `run_id` if one was created.
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest sequence of commands that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and logs
      description: Screenshots, hierarchy, logcat or report excerpts. Redact sensitive data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and could not find this problem.
          required: true
        - label: I removed secrets, personal data and private app content from this report.
          required: true
