<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AndroidForge worker robot">
  <!-- The Android robot is reproduced/modified from work created and shared by
       Google and used according to the Creative Commons 3.0 Attribution
       License. See THIRD_PARTY_NOTICES.md. The wrench path is from Lucide. -->
  <rect width="512" height="512" fill="#0B0E13"/>
  <rect width="512" height="512" rx="112" fill="#0B0E13"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#252C39" stroke-width="8"/>

  <!-- Official Android robot silhouette. -->
  <g transform="translate(256 127.5) scale(1.25)">
    <g fill="#A4C639">
      <use stroke-width="14.4" xlink:href="#body" stroke="#F4F8F4"/>
      <use xlink:href="#limbs" transform="scale(-1,1)"/>
      <g id="limbs" stroke="#F4F8F4" stroke-width="7.2">
        <rect rx="6.5" transform="rotate(29)" height="86" width="13" y="-86" x="14"/>
        <rect id="leg" rx="24" height="133" width="48" y="41" x="-143"/>
        <use y="97" x="85" xlink:href="#leg"/>
      </g>
      <g id="body">
        <ellipse cy="41" rx="91" ry="84"/>
        <rect rx="22" height="182" width="182" y="20" x="-91"/>
      </g>
    </g>
    <g stroke="#F4F8F4" stroke-width="7.2" fill="#F4F8F4">
      <path d="m-95 44.5h190"/>
      <circle cx="-42" r="4"/>
      <circle cx="42" r="4"/>
    </g>
  </g>

  <!-- Hard hat: narrower than the head and sitting between the antennae. -->
  <g>
    <path d="M198 108 A58 40 0 0 1 314 108 Z" fill="#F5A524" stroke="#C77C12" stroke-width="4"/>
    <rect x="188" y="102" width="136" height="18" rx="8" fill="#F5A524" stroke="#C77C12" stroke-width="3"/>
    <path d="M256 71 L256 106" stroke="#FFC857" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 84 A40 26 0 0 1 296 84" fill="none" stroke="#FFC857" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Simple open-end wrench held against the right arm. -->
  <g transform="translate(346 250) scale(4.6)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#7D8794" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#C9D1D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
